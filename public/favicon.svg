<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Isometric block: a ledger block and the HSM from the site at once. Signal-orange lid, dark metal sides. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211f1b"/>
      <stop offset="1" stop-color="#0e0d0b"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4f"/>
      <stop offset="1" stop-color="#ff4d0a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <polygon points="32,11 51,21.5 32,32 13,21.5" fill="url(#top)"/>
  <polygon points="13,21.5 32,32 32,53 13,42.5" fill="#4a463f"/>
  <polygon points="51,21.5 32,32 32,53 51,42.5" fill="#2b2924"/>
  <polyline points="13,21.5 13,42.5 32,53 51,42.5 51,21.5" fill="none" stroke="#5e5950" stroke-width="1"/>
  <line x1="32" y1="32" x2="32" y2="53" stroke="#6b665c" stroke-width="1"/>
  <polyline points="13,21.5 32,32 51,21.5" fill="none" stroke="#ffc2a0" stroke-width="1"/>
  <line x1="17.5" y1="35.5" x2="27.5" y2="41" stroke="#ff6a2b" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="17.5" y1="35.5" x2="27.5" y2="41" stroke="#ff8a4f" stroke-width="2.2" stroke-linecap="round"/>
</svg>
